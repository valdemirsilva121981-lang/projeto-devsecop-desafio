name: 🔐 Pipeline DevSecOps

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pipeline:
    name: Build, Segurança e Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Build
        run: |
          echo "Verificando arquivos..."
          ls src/ || echo "Pasta src nao encontrada"
          echo "Build OK!"

      # Passo 3: Secrets Scanning (Gitleaks)
      - name: 🔑 Secrets Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Passo 4: SAST com a Action Oficial do Semgrep
      - name: 🔍 SAST - Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default

      # Passo 5: SCA com a Action Oficial do Grype (Corrigido para evitar o erro 127)
      - name: 📦 SCA - Grype
        uses: anchore/scan-action@v3
        with:
          path: "."
          fail-build: true
          severity-cutoff: "medium"

      # Passo 6: Deploy automatizado para o GitHub Pages
      - name: 🌐 Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload para Produção
        uses: actions/upload-pages-artifact@v3
        with:
          path: './src'

      - name: 🚀 Deploy em Produção
        id: deployment
        uses: actions/deploy-pages@v4
